name: Decode base64 images
on:
  push:
    paths:
      - 'b64/**'
      - '.github/workflows/decode-images.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode b64 to PNG
        run: |
          mkdir -p images
          for f in b64/*.png.b64; do
            [ -f "$f" ] || continue
            out="images/$(basename "$f" .b64)"
            base64 -d "$f" > "$out"
            file "$out"
          done
          ls -la images/
      - name: Commit PNGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/*.png
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "Decode base64 assets to PNG"
          git push
