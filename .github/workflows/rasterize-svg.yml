name: Rasterize SVG marketing assets
on:
  push:
    paths:
      - 'svg/**'
      - '.github/workflows/rasterize-svg.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rasterize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install rsvg-convert
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin
      - name: Convert SVG to PNG
        run: |
          mkdir -p images
          for f in svg/*.svg; do
            [ -f "$f" ] || continue
            out="images/$(basename "$f" .svg).png"
            rsvg-convert -w 1200 -h 675 "$f" -o "$out"
            file "$out"
            ls -la "$out"
          done
      - name: Commit PNGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/*.png
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "Rasterize SVG assets to PNG for Buffer/X"
          git push
